<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segmented Circle Loader</title>
    <style>
        .loader {
            width: 50px;
            --b: 8px; /* border thickness */
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 1px;
            background: conic-gradient(transparent 10%, #f03355) content-box;
            -webkit-mask:
                repeating-conic-gradient(
                    transparent 0deg,
                    #000 1deg 20deg,
                    transparent 21deg 36deg
                ),
                radial-gradient(
                    farthest-side,
                    transparent calc(100% - var(--b) - 1px),
                    #000 calc(100% - var(--b))
                );
            -webkit-mask-composite: destination-in;
            mask-composite: intersect;
            animation: spin 1s infinite steps(10);
        }

        @keyframes spin {
            to { transform: rotate(1turn); }
        }

        /* Optional centering styles */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
